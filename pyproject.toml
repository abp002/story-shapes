[project]
name = "story-shapes"
version = "0.1.0"
description = "The shapes of stories, drawn by a model that decides instead of writing."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "matplotlib>=3.9",
    "numpy>=2.0",
]

[project.scripts]
story-shapes = "story_shapes.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
