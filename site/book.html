<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>story-shapes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script type="module" src="book.js"></script>
</head>
<body>
<header class="wrap top">
<a class="brand" href="./">story-shapes</a>
<nav aria-label="Navigation"><a href="./#books">← All 29 books</a></nav>
</header>

<main class="wrap" id="book" aria-busy="true" style="display:flex;flex-direction:column;gap:28px;padding-bottom:72px">
<div style="padding-top:48px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:24px">
<div style="display:flex;flex-direction:column;gap:10px">
<span class="mono muted" id="byline" style="font-size:14px"></span>
<h1 id="title"></h1>
</div>
<dl class="facts" id="facts"></dl>
</div>
<p class="lede" id="why" style="max-width:760px"></p>

<div class="moments" id="moments" role="group" aria-label="Jump to a moment"></div>

<figure class="figure" style="border-bottom:0;padding-top:18px">
<div class="figure-head">
<figcaption style="font-size:24px;font-weight:700" id="fortune-title">Fortune</figcaption>
<span class="mono muted" style="font-size:12px">dots: passages (faded when the hero is absent) · line: smoothed · band: 95 % · dashed: expected shape</span>
</div>
<div class="chart">
<div class="axis" id="levels" aria-hidden="true"></div>
<div style="flex:1 1 auto;min-width:0;display:flex;flex-direction:column">
<div class="chapters" id="chapters" aria-hidden="true"></div>
<div class="plot">
<svg id="fortune" viewBox="0 0 1000 400" width="100%" role="img"></svg>
<div id="markers"></div>
</div>
</div>
</div>
</figure>

<figure class="figure" style="border-bottom:0;padding-top:14px">
<div class="figure-head">
<figcaption style="font-size:18px;font-weight:700">Tension</figcaption>
<span class="mono muted" style="font-size:12px">from calm to climax</span>
</div>
<div class="chart">
<div class="axis" aria-hidden="true"><span style="top:4%">climax</span><span style="top:96%">calm</span></div>
<svg id="tension" viewBox="0 0 1000 160" width="100%" role="img" aria-label="Tension through the book" style="flex:1 1 auto;min-width:0"></svg>
</div>
<div class="mono muted" style="display:flex;justify-content:space-between;padding:6px 0 0 104px;font-size:12px"><span>first page</span><span>last page</span></div>
</figure>

<div class="scrub">
<label for="scrub" class="mono" id="scrub-label" style="font-size:14px"></label>
<input id="scrub" type="range" min="0" step="1">
</div>

<section class="reader" aria-live="polite" style="padding-bottom:0">
<blockquote>
<span class="mono muted" id="where" style="font-size:14px"></span>
<p id="quote"></p>
<span class="mono muted" id="present" style="font-size:14px"></span>
</blockquote>
<div class="answer">
<span class="mono muted" id="question" style="font-size:14px"></span>
<div id="bars"></div>
</div>
</section>

<p class="mono muted" id="source" style="margin:0;padding-top:16px;border-top:1px solid var(--ink);font-size:14px"></p>
</main>
</body>
</html>
